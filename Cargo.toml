[package]
name = "osr"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
jiff = "0.2.38"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"

[dev-dependencies]
cucumber = "0.23.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[[test]]
name = "escenarios"
harness = false

# Las dependencias optimizadas en desarrollo, para que los escenarios con
# cientos de miles de pedidos tarden segundos; osr sigue sin optimizar (D-36).
[profile.dev.package."*"]
opt-level = 2
debug = false
