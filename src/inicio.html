<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Social Research</title>
<style>
  /* Tokens de color de docs/diseno/README.md. */
  :root {
    --papel: #FBFAF7; --superficie: #FFFFFF; --hundido: #F1EFEA;
    --tinta: #1A1916; --tinta-2: #4A4741; --tinta-3: #67635B;
    --linea: #DDD9D1; --linea-fuerte: #8A857B;
    --acento: #2350A8; --acento-suave: #E5ECF8; --sobre-acento: #FFFFFF;
    --error: #B3261E; --error-suave: #FBEAE7; --sobre-error: #FFFFFF;
    --trama: rgba(26,25,22,.22); --velo: rgba(26,25,22,.42);
  }
  [data-tema="oscuro"] {
    --papel: #161513; --superficie: #1E1D1A; --hundido: #27251F;
    --tinta: #ECE9E2; --tinta-2: #BEB9AF; --tinta-3: #9C978D;
    --linea: #36332D; --linea-fuerte: #7A766C;
    --acento: #8FB2F2; --acento-suave: #1E2A42; --sobre-acento: #0F1420;
    --error: #F09A90; --error-suave: #3A1E1B; --sobre-error: #1A0D0B;
    --trama: rgba(236,233,226,.24); --velo: rgba(0,0,0,.62);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="claro"]) {
      --papel: #161513; --superficie: #1E1D1A; --hundido: #27251F;
      --tinta: #ECE9E2; --tinta-2: #BEB9AF; --tinta-3: #9C978D;
      --linea: #36332D; --linea-fuerte: #7A766C;
      --acento: #8FB2F2; --acento-suave: #1E2A42; --sobre-acento: #0F1420;
      --error: #F09A90; --error-suave: #3A1E1B; --sobre-error: #1A0D0B;
      --trama: rgba(236,233,226,.24); --velo: rgba(0,0,0,.62);
    }
  }
  body { margin: 0; padding: 48px; background: var(--papel); color: var(--tinta);
         font: 13px/1.5 system-ui, sans-serif; }
  section { max-width: 480px; margin-bottom: 32px; padding: 20px;
            background: var(--superficie); border: 1px solid var(--linea); border-radius: 4px; }
  h1 { font-size: 28px; margin: 0 0 32px; }
  h2 { font-size: 18px; margin: 0 0 16px; }
  label { display: block; margin-bottom: 12px; color: var(--tinta-2); }
  input { display: block; width: 100%; box-sizing: border-box; height: 32px; margin-top: 4px;
          padding: 0 8px; border: 1px solid var(--linea-fuerte); border-radius: 3px;
          background: var(--superficie); color: var(--tinta); font-family: monospace; }
  button { height: 32px; padding: 0 16px; border: 0; border-radius: 3px;
           background: var(--tinta); color: var(--papel); font: inherit; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
</style>
</head>
<body>
<h1>Open Social Research</h1>
<section>
  <h2>Abrir proyecto</h2>
  <form>
    <label>Carpeta del proyecto <input name="ruta" required></label>
    <button>Abrir proyecto</button>
  </form>
</section>
<section>
  <h2>Crear proyecto</h2>
  <form>
    <label>Carpeta nueva o vacía <input name="ruta" required></label>
    <label>Nombre <input name="nombre"></label>
    <button>Crear proyecto</button>
  </form>
</section>
</body>
</html>
